<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SkipFit AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>SkipFit AI</h1>
  <p>By Aditya Kumar Yadav</p>
  <span>Train • Count • Improve</span>
</header>

<main>

<section class="card">
  <h2>🪢 Skipping Counter</h2>
  <div id="status">Loading AI...</div>

  <div class="counter" id="liveCount">0</div>
  <p>SKIPS</p>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="buttons">
    <button id="frontBtn">Front Camera</button>
    <button id="rearBtn">Rear Camera</button>
    <button id="openCamera">Open Camera</button>
    <button id="stopCamera">Stop Camera</button>
  </div>

  <hr>

  <button id="recordBtn">🔴 Start Recording</button>
  <video id="recordedVideo" controls playsinline hidden></video>
</section>

<section class="card">
  <h2>📁 Analyze Skipping Video</h2>

  <input id="videoFile" type="file" accept="video/*">

  <video id="fileVideo" controls playsinline hidden></video>

  <button id="analyzeBtn">🧠 Analyze Video</button>

  <div class="counter small" id="fileCount">0</div>
  <p>DETECTED SKIPS</p>

  <p id="fileStatus">Choose a video.</p>
</section>

<section class="card">
  <h2>📊 Progress</h2>
  <div class="progressNumber" id="totalSkips">0</div>
  <p>TOTAL SAVED SKIPS</p>
  <button id="saveBtn">Save Current Count</button>
  <button id="resetBtn">Reset Progress</button>
</section>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
