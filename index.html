<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkipFit AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#07111f;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

header{
  padding:20px 10px;
}

h1{
  margin:0;
  font-size:32px;
}

p{
  opacity:.75;
}

.card{
  width:94%;
  max-width:700px;
  margin:auto;
  background:#101f32;
  padding:15px;
  border-radius:18px;
}

#status{
  padding:12px;
  margin-bottom:12px;
  background:#182b40;
  border-radius:10px;
  font-weight:bold;
}

.camera-box{
  position:relative;
  width:100%;
  background:#000;
  border-radius:15px;
  overflow:hidden;
}

#camera{
  display:none;
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  transform:scaleX(-1);
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
  transform:scaleX(-1);
}

#count{
  font-size:70px;
  font-weight:bold;
  margin:15px;
}

button{
  width:100%;
  padding:15px;
  margin:6px 0;
  border:0;
  border-radius:12px;
  background:#1677ff;
  color:white;
  font-size:16px;
  font-weight:bold;
}

#stopBtn{
  background:#913333;
}
</style>
</head>

<body>

<header>
  <h1>SkipFit AI</h1>
  <p>By Aditya Kumar Yadav</p>
</header>

<div class="card">

  <div id="status">
    Loading AI...
  </div>

  <div class="camera-box">

    <video
      id="camera"
      autoplay
      muted
      playsinline>
    </video>

    <canvas id="overlay"></canvas>

  </div>

  <div id="count">0</div>

  <button id="startBtn">
    📷 START CAMERA
  </button>

  <button id="stopBtn">
    ⛔ STOP CAMERA
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<script src="script.js"></script>

</body>
</html>
