<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SkipFit AI</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#07111f;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

header{
  padding:20px 10px;
}

h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:7px 0;
  opacity:.7;
}

.card{
  width:94%;
  max-width:700px;
  margin:auto;
  background:#101f32;
  padding:15px;
  border-radius:18px;
}

#status{
  padding:12px;
  margin-bottom:12px;
  background:#182b40;
  border-radius:10px;
  font-weight:bold;
}

.camera-box{
  position:relative;
  width:100%;
  background:#000;
  border-radius:15px;
  overflow:hidden;
}

#camera{
  display:none;
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}

.info div{
  background:#182b40;
  padding:10px 4px;
  border-radius:9px;
  font-size:11px;
}

.label{
  opacity:.65;
}

.value{
  margin-top:4px;
  font-weight:bold;
}

#gesture{
  margin-top:12px;
  padding:13px;
  background:#172c43;
  border-radius:10px;
  font-weight:bold;
}

#count{
  font-size:65px;
  font-weight:bold;
  margin:12px;
}

button{
  width:100%;
  padding:15px;
  margin:6px 0;
  border:0;
  border-radius:12px;
  background:#1677ff;
  color:white;
  font-size:16px;
  font-weight:bold;
}

#stopBtn{
  background:#913333;
}

#resetBtn{
  background:#27394d;
}

.help{
  margin-top:12px;
  padding:12px;
  background:#0b1726;
  border-radius:10px;
  font-size:12px;
  line-height:1.5;
  opacity:.8;
}

</style>
</head>

<body>

<header>

<h1>SkipFit AI</h1>

<p>By Aditya Kumar Yadav</p>

</header>


<div class="card">

<div id="status">
Loading AI...
</div>


<div class="camera-box">

<video
id="camera"
autoplay
muted
playsinline>
</video>

<canvas id="overlay"></canvas>

</div>


<div class="info">

<div>
<div class="label">FRAME</div>
<div class="value" id="frame">0</div>
</div>

<div>
<div class="label">FPS</div>
<div class="value" id="fps">0</div>
</div>

<div>
<div class="label">BODY</div>
<div class="value" id="body">WAIT</div>
</div>

</div>


<div id="gesture">
GESTURE: WAITING
</div>


<div>
<div style="opacity:.6">
SKIPS
</div>

<div id="count">
0
</div>

</div>


<button id="startBtn">
📷 START BACK CAMERA
</button>


<button id="stopBtn">
⛔ STOP CAMERA
</button>


<button id="resetBtn">
🔄 RESET
</button>


<div class="help">

Stand far enough away so your full body is visible.
<br>
The system processes the camera frame-by-frame using MoveNet.

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<script src="script.js"></script>

</body>

</html>
