
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkipFit AI</title>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: #101f32;
      padding: 20px;
      border-radius: 18px;
    }

    h1 {
      margin-top: 0;
    }

    #status {
      padding: 15px;
      background: #182b40;
      border-radius: 10px;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: none;
      border-radius: 12px;
      background: #1677ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #count {
      font-size: 60px;
      font-weight: bold;
      margin: 15px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>SkipFit AI</h1>

    <p>By Aditya Kumar Yadav</p>

    <div id="status">
      Website is working ✅
    </div>

    <div>
      SKIPS
      <div id="count">0</div>
    </div>

    <button onclick="testButton()">
      TEST WEBSITE
    </button>

  </div>

  <script>
    function testButton() {
      document.getElementById("status").textContent =
        "JavaScript is working ✅";
    }
  </script>

</body>
</html>
