<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SkipFit AI</title>

  <style>
    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 650px;
      margin: auto;
      background: #101f32;
      padding: 18px;
      border-radius: 18px;
    }

    h1 {
      margin: 0;
    }

    #status {
      background: #182b40;
      padding: 14px;
      border-radius: 10px;
      margin: 15px 0;
      font-weight: bold;
    }

    .camera-box {
      width: 100%;
      background: black;
      border-radius: 15px;
      overflow: hidden;
    }

    #camera {
      display: none;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: #1677ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #backCameraBtn {
      background: #168f6b;
    }

    #stopBtn {
      background: #913333;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>SkipFit AI</h1>

    <p>By Aditya Kumar Yadav</p>

    <div id="status">
      Camera ready
    </div>

    <div class="camera-box">

      <video
        id="camera"
        autoplay
        muted
        playsinline>
      </video>

    </div>

    <button id="startBtn">
      📷 START CAMERA
    </button>

    <button id="backCameraBtn">
      📷 USE BACK CAMERA
    </button>

    <button id="stopBtn">
      ⛔ STOP CAMERA
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
