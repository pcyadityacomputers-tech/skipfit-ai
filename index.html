<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkipFit AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#081018;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:20px 10px;
}

h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:6px 0;
  opacity:.8;
}

header small{
  opacity:.6;
}

main{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#121c26;
  border-radius:18px;
  padding:15px;
}

#status{
  padding:12px;
  text-align:center;
  background:#1c2935;
  border-radius:10px;
  margin-bottom:12px;
}

.videoBox{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:14px;
  overflow:hidden;
}

video,canvas{
  position:absolute;
  width:100%;
  height:100%;
  left:0;
  top:0;
  object-fit:contain;
}

#camera,#videoFilePlayer{
  display:none;
}

.info{
  display:flex;
  gap:7px;
  margin:12px 0;
}

.info div{
  flex:1;
  text-align:center;
  padding:10px 3px;
  background:#1c2935;
  border-radius:9px;
  font-size:12px;
}

#stage{
  text-align:center;
  font-weight:bold;
  margin:14px 0;
}

.title{
  text-align:center;
  opacity:.6;
}

#count{
  text-align:center;
  font-size:65px;
  font-weight:bold;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button,.fileButton{
  border:0;
  border-radius:12px;
  padding:14px 8
