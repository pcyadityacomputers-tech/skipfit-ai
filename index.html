<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SkipFit AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 650px;
      margin: auto;
      background: #101f32;
      padding: 18px;
      border-radius: 18px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    #status {
      background: #182b40;
      padding: 14px;
      border-radius: 10px;
      margin: 15px 0;
      font-weight: bold;
    }

    .camera-box {
      width: 100%;
      background: black;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }

    #camera {
      display: none;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }

    #overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
      background: #182b40;
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 12px;
    }

    .stat-value {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-top: 4px;
    }

    .skip-title {
      margin-top: 15px;
      opacity: 0.7;
    }

    #count {
      font-size: 65px;
      font-weight: bold;
      margin: 5px;
    }

    #gesture {
      background: #172c43;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      background: #1677ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #backCameraBtn {
      background: #168f6b;
    }

    #stopBtn {
      background: #913333;
    }

    #resetBtn {
      background: #27394d;
    }

    .help {
      margin-top: 15px;
      padding: 12px;
      background: #0b1726;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>SkipFit AI</h1>

    <p>By Aditya Kumar Yadav</p>

    <div id="status">
      Loading AI...
    </div>

    <div class="camera-box">

      <video
        id="camera"
        autoplay
        muted
        playsinline>
      </video>

      <canvas id="overlay"></canvas>

    </div>

    <div class="stats">

      <div class="stat">
        FRAME
        <span
          class="stat-value"
          id="frame">
          0
        </span>
      </div>

      <div class="stat">
        FPS
        <span
          class="stat-value"
          id="fps">
          0
        </span>
      </div>

      <div class="stat">
        BODY
        <span
          class="stat-value"
          id="body">
          WAIT
        </span>
      </div>

    </div>

    <div id="gesture">
      GESTURE: WAITING
    </div>

    <div class="skip-title">
      SKIPS
    </div>

    <div id="count">
      0
    </div>

    <button id="startBtn">
      📷 START CAMERA
    </button>

    <button id="backCameraBtn">
      📷 USE BACK CAMERA
    </button>

    <button id="stopBtn">
      ⛔ STOP CAMERA
    </button>

    <button id="resetBtn">
      🔄 RESET
    </button>

    <div class="help">
      Keep your full body visible.
      <br>
      Keep the phone still.
      <br>
      Jump normally while skipping.
    </div>

  </div>
