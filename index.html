<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkipFit AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#081018;
color:white;
font-family:Arial,sans-serif;
}

header{
text-align:center;
padding:20px 10px;
}

h1{
margin:0;
font-size:32px;
}

header p{
margin:6px 0;
opacity:.8;
}

header small{
opacity:.6;
}

main{
max-width:700px;
margin:auto;
padding:15px;
}

.card{
background:#121c26;
border-radius:18px;
padding:15px;
}

#status{
padding:12px;
text-align:center;
background:#1c2935;
border-radius:10px;
margin-bottom:12px;
}

.videoBox{
position:relative;
width:100%;
aspect-ratio:16/9;
background:#000;
border-radius:14px;
overflow:hidden;
}

video,canvas{
position:absolute;
width:100%;
height:100%;
left:0;
top:0;
object-fit:contain;
}

#camera,#videoFilePlayer{
display:none;
}

.info{
display:flex;
gap:7px;
margin:12px 0;
}

.info div{
flex:1;
text-align:center;
padding:10px 3px;
background:#1c2935;
border-radius:9px;
font-size:12px;
}

#stage{
text-align:center;
font-weight:bold;
margin:14px 0;
}

.title{
text-align:center;
opacity:.6;
}

#count{
text-align:center;
font-size:65px;
font-weight:bold;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button,.fileButton{
border:0;
border-radius:12px;
padding:14px 8px;
background:#263746;
color:white;
font-weight:bold;
font-size:14px;
text-align:center;
cursor:pointer;
}

.primary{
background:#147cff;
}

.danger{
background:#913333;
}

button:disabled{
opacity:.4;
}

input{
display:none;
}

#progress{
width:100%;
margin-top:15px;
}

.help{
margin-top:15px;
padding:12px;
background:#1c2935;
border-radius:12px;
font-size:13px;
line-height:1.5;
}

@media(max-width:500px){
.buttons{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<h1>SkipFit AI</h1>
<p>By Aditya Kumar Yadav</p>
<small>AI Skipping Counter</small>
</header>

<main>

<div class="card">

<div id="status">Website ready</div>

<div class="videoBox">

<video id="camera"
autoplay
muted
playsinline></video>

<video id="videoFilePlayer"
controls
muted
playsinline></video>

<canvas id="canvas"></canvas>

</div>

<div class="info">

<div id="cameraState">CAMERA ○</div>

<div id="videoState">VIDEO ○</div>

<div id="aiState">AI ○</div>

</div>

<div id="stage">READY</div>

<div class="title">SKIPS</div>

<div id="count">0</div>

<div class="buttons">

<button id="startCamera" class="primary">
📷 START CAMERA
</button>

<button id="switchCamera" disabled>
🔄 SWITCH CAMERA
</button>

<button id="stopCamera" class="danger" disabled>
⛔ STOP CAMERA
</button>

<label for="videoInput" class="fileButton">
📁 CHOOSE VIDEO
</label>

<input id="videoInput" type="file" accept="video/*">

<button id="analyzeVideo" class="primary" disabled>
🧠 ANALYZE VIDEO
</button>

</div>

<progress id="progress" value="0" max="100"></progress>

<div class="help">
<b>Camera:</b> Press START CAMERA and allow camera permission.
<br><br>
<b>Video:</b> Press CHOOSE VIDEO and select your skipping video.
The video will appear above.
</div>

</div>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
